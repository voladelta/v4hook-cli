[package]
name = "v4hook-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.97.1"
description = "Foundry-backed verification and launch gates for Uniswap v4 hooks"
license = "MIT"

[[bin]]
name = "v4hook"
path = "src/main.rs"

[dependencies]
alloy-primitives = "=1.6.1"
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.6", features = ["derive"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
include_dir = "=0.7.4"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
daemonize = "=0.5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
incremental = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
